name: Restore deleted cards
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-cards.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore every card ever deleted
        run: |
          git log --diff-filter=D --pretty=format: --name-only -- 'cards/*-card-*.png' \
            | grep card | sort -u > restore.txt
          echo "Found $(wc -l < restore.txt) deleted cards"
          while read -r f; do
            del=$(git rev-list -n 1 HEAD -- "$f")
            if [ -n "$del" ]; then
              git checkout "$del^" -- "$f" && echo "restored: $f" || echo "skipped: $f"
            fi
          done < restore.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards
          if ! git diff --cached --quiet; then
            git commit -m "Restore cards deleted by prune sort bug"
            git push
          else
            echo "Nothing to restore"
          fi
